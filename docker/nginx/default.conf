server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    # Docker's embedded DNS. With the upstream in a variable nginx resolves "php" at request time
    # (cached for 10 s) instead of once at startup, so a recreated php container with a new IP
    # does not cause 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Block direct access to any other PHP file
    location ~ \.php$ {
        return 404;
    }
}
